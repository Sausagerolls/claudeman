name: ClaudemanRemote
options:
  bundleIdPrefix: com.sausagerolls
  deploymentTarget:
    iOS: "17.0"
packages:
  ClaudemanKit:
    path: ../Packages/ClaudemanKit
targets:
  ClaudemanRemote:
    type: application
    platform: iOS
    sources:
      - ClaudemanRemote
    dependencies:
      - package: ClaudemanKit
        product: ClaudemanKit
    info:
      path: ClaudemanRemote/Info.plist
      properties:
        CFBundleDisplayName: Claudeman
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: Claudeman uses the local network to find your Mac and control Claude Code sessions on it.
        NSBonjourServices: [_claudeman._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sausagerolls.claudeman.remote
        PRODUCT_NAME: Claudeman Remote
        DEVELOPMENT_TEAM: J4UJD4Z33J
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
